<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AIOne Web</title>
    <style>
        body {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            font-family: system-ui, sans-serif;
        }

        #chat {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 24px 0;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            background: #eee;
            white-space: pre-wrap;
        }

        .user {
            align-self: flex-end;
            background: #dceaff;
        }

        .assistant {
            align-self: flex-start;
        }

        #composer {
            display: flex;
            gap: 8px;
        }

        #prompt {
            flex: 1;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h2>AIOne Web</h2>

    <input id="model" type="file" accept=".gguf">
    <button id="load" disabled>Load model</button>

    <p id="status">Select a GGUF file.</p>

    <div id="chat"></div>

    <form id="composer">
        <input id="prompt" placeholder="Write a message..." disabled>
        <button id="generate" disabled>Send</button>
    </form>

    <script type="module">
        const input = document.getElementById("model");
        const loadButton = document.getElementById("load");
        const status = document.getElementById("status");
        const chat = document.getElementById("chat");
        const composer = document.getElementById("composer");
        const prompt = document.getElementById("prompt");
        const generateButton = document.getElementById("generate");

        const worker = new Worker("./worker.js", {
            type: "module"
        });

        let loaded = false;
        let generating = false;

        function addMessage(role, content) {
            const message = document.createElement("div");
            message.className = `message ${role}`;
            message.textContent = content;
            chat.appendChild(message);
            return message;
        }

        input.addEventListener("change", () => {
            loadButton.disabled = !input.files.length;
        });

        loadButton.addEventListener("click", () => {
            const file = input.files[0];

            loadButton.disabled = true;
            status.textContent =
                `Loading ${file.name} (${(file.size / 1073741824).toFixed(2)} GB)...`;

            worker.postMessage({
                type: "load",
                file
            });
        });

        composer.addEventListener("submit", event => {
            event.preventDefault();

            const text = prompt.value.trim();

            if (!text || !loaded || generating) return;

            addMessage("user", text);
            prompt.value = "";

            generating = true;
            generateButton.disabled = true;
            prompt.disabled = true;
            status.textContent = "Generating...";

            worker.postMessage({
                type: "generate",
                prompt: text,
                maxTokens: 512
            });
        });

        worker.addEventListener("message", ({ data }) => {
            if (data.type === "loaded") {
                loaded = true;
                status.textContent = "Model loaded!";
                prompt.disabled = false;
                generateButton.disabled = false;
                prompt.focus();
            }

            if (data.type === "generated") {
                addMessage("assistant", data.result);
                generating = false;
                generateButton.disabled = false;
                prompt.disabled = false;
                status.textContent = "Ready.";
                prompt.focus();
            }

            if (data.type === "error") {
                status.textContent = "Error: " + data.message;
                generating = false;
                loadButton.disabled = false;
                generateButton.disabled = !loaded;
                prompt.disabled = !loaded;
            }
        });
    </script>
</body>
</html>
